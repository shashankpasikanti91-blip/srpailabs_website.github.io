<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRP AI Labs — Business Software for HR, Recruitment, Growth & Healthcare</title>
    <meta name="description" content="SRP AI Labs is a multi-product platform with 10 specialized software systems for HR, recruitment, sales, healthcare, education, and operations. Built for real teams." />
    <meta name="keywords" content="HRMS Software, Recruitment Automation, Applicant Tracking System, Sales Automation, Healthcare Management, Education Platform, Nutrition App, Kids Learning, Business Automation, Workflow Automation, SRP AI Labs" />
    <meta name="author" content="SRP AI Labs" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <meta property="og:title" content="SRP AI Labs — 10 Specialized Products for Modern Business" />
    <meta property="og:description" content="10 specialized software products for HR, recruitment, healthcare, education & growth. One platform." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://srpailabs.com/og-image.png" />
    <meta property="og:url" content="https://srpailabs.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SRP AI Labs — Business Software for Modern Teams" />
    <meta name="twitter:description" content="A multi-product platform with 10 independent systems for HR, recruitment, growth, healthcare, and education. Built for teams that need results." />
    <meta name="twitter:image" content="https://srpailabs.com/og-image.png" />

    <link rel="canonical" href="https://srpailabs.com" />
    <style>
      body { 
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
      }
      #loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e293b);
      }
      .loader {
        text-align: center;
      }
      .loader h1 {
        font-size: 32px;
        margin: 0 0 20px 0;
      }
      .loader p {
        font-size: 16px;
        color: #94a3b8;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 20px auto;
        border: 4px solid #1e293b;
        border-top: 4px solid #0ea5e9;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #error {
        display: none;
        padding: 40px;
        text-align: center;
      }
      .error-box {
        background: #7f1d1d;
        border: 1px solid #fca5a5;
        border-radius: 8px;
        padding: 20px;
        margin: 20px auto;
        max-width: 600px;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="loading">
        <div class="loader">
          <h1>SRP AI Labs</h1>
          <p>Loading application...</p>
          <div class="spinner"></div>
        </div>
      </div>
      <div id="error">
        <h1>⚠️ Application Error</h1>
        <div class="error-box">
          <p>The application failed to load. Please try:</p>
          <ul style="text-align: left;">
            <li>Refreshing the page (Ctrl+R or Cmd+R)</li>
            <li>Clearing browser cache (Ctrl+Shift+Del)</li>
            <li>Opening in an incognito/private window</li>
            <li>Checking browser console (F12) for errors</li>
          </ul>
        </div>
      </div>
    </div>

    <noscript>
      <div style="padding: 40px; text-align: center; color: red;">
        <h1>JavaScript is required</h1>
        <p>This application requires JavaScript to be enabled.</p>
      </div>
    </noscript>

    <script>
      // Show error after 5 seconds if app didn't load
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      
      setTimeout(() => {
        if (loading && loading.parentElement) {
          loading.style.display = 'none';
          error.style.display = 'block';
          console.error('[ERROR] App failed to load within 5 seconds');
        }
      }, 5000);

      window.addEventListener('error', (e) => {
        console.error('[Window Error]', e.error);
        loading.style.display = 'none';
        error.style.display = 'block';
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
